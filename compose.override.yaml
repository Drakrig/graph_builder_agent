services:
  memgraph:
    volumes:
      - ./memgraph/mg_lib:/var/lib/memgraph
      - ./memgraph/mg_log:/var/log/memgraph
  weaviate:
    volumes:
    - ../weaviate/database:/var/lib/weaviate
  
  ollama:
    volumes:
      - /home/drakrig/Projects/ML/ollama_compose/ollama_data:/root/ollama/.ollama
    deploy:
      resources:
          reservations:
              devices:
                - driver: nvidia
                  device_ids: ['0']
                  capabilities: ['gpu']